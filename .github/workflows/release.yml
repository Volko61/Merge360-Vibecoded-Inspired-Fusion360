name: Release

# Push a tag like `v0.2.0` to build all targets and publish a GitHub release.
# Running the workflow manually builds the same archives as downloadable
# workflow artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    archive: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Test
        run: cargo test --workspace --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build -p merge360 --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="${GITHUB_SHA::7}"
          name="merge360-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/merge360"
          [[ "$RUNNER_OS" == Windows ]] && bin="$bin.exe"
          cp "$bin" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            # Flat zip (no top-level folder): winget's portable installer
            # references merge360.exe by a version-independent path.
            (cd "$name" && 7z a "../$name.zip" . > /dev/null)
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=dist/$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  winget:
    name: Publish to winget
    needs: release
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: windows-latest
    steps:
      # Opens a PR on microsoft/winget-pkgs for each new release, which is what
      # makes `winget upgrade` see it. Needs a classic PAT (public_repo) in the
      # WINGET_TOKEN secret, and the first version submitted manually
      # (see packaging/winget/README.md).
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Volko61.Merge360
          installers-regex: 'merge360-.*-(x86_64|aarch64)-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
