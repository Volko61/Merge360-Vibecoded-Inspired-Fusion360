[workspace]
resolver = "2"
members = ["crates/m360-core", "crates/m360-kernel", "crates/m360-render", "crates/m360-ui", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
m360-core = { path = "crates/m360-core" }
m360-kernel = { path = "crates/m360-kernel" }
m360-render = { path = "crates/m360-render" }
m360-ui = { path = "crates/m360-ui" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.36"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
truck-modeling = "0.6"
truck-meshalgo = "0.4"
truck-shapeops = "0.4"
truck-stepio = "0.3"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
